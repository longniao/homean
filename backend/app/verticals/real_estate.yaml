consent:
  # Clients render this exact wording and send the version back, so a visit
  # records which text was attested to rather than only that something was.
  # Bump the version whenever the wording changes; old visits keep resolving
  # to the wording their agent actually saw.
  version: re_consent_v1
  text: >-
    I attest that I have the consent of every party required to record this
    showing.
  # PLACEHOLDER WORDING. This value is asserted by a test so the placeholder
  # cannot ship silently: set it to "reviewed" only when counsel has approved
  # consent.text, scope_disclosure and recording_disclosure together.
  counsel_review_status: pending
# Spoken cues that place a photo in a room. The agent names the room, then
# shoots. Longer phrases win, so "primary bedroom" never collapses to "bedroom".
# Display labels and the zone key itself are always accepted; list only extras.
zone_speech_aliases:
  kitchen: [kitchen]
  living_room: [living room, lounge, front room, sitting room, family room]
  dining_room: [dining room, dining area]
  primary_bedroom: [primary bedroom, master bedroom, main bedroom, primary suite]
  bedroom: [bedroom, second bedroom, guest room, spare room]
  bathroom: [bathroom, ensuite, powder room, washroom]
  basement: [basement, cellar, lower level]
  garage: [garage, carport]
  backyard: [backyard, back yard, back garden, rear yard]
  front_exterior: [front exterior, front yard, curb, front of the house]
  balcony: [balcony, terrace, deck, patio]
  laundry: [laundry, laundry room, utility room, mud room]
  office: [office, study, den]
  hallway: [hallway, hall, landing, entryway, foyer]
