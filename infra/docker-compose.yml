name: homean

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://homean:homean@postgres:5432/homean
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-homean}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-homean-minio-secret}
  S3_BUCKET: homean-media
  S3_REGION: ${S3_REGION:-us-east-1}
  PRESIGNED_UPLOAD_SECONDS: ${PRESIGNED_UPLOAD_SECONDS:-900}
  PRESIGNED_DOWNLOAD_SECONDS: ${PRESIGNED_DOWNLOAD_SECONDS:-300}
  JWT_SECRET: ${JWT_SECRET:-local-compose-only-secret}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-deepgram}
  PIPELINE_DEEPGRAM_MODEL: ${PIPELINE_DEEPGRAM_MODEL:-nova-3}
  PIPELINE_ZONE_DETECTION_MODEL: ${PIPELINE_ZONE_DETECTION_MODEL:-claude-opus-4-8}
  PIPELINE_OBSERVATION_EXTRACTION_MODEL: ${PIPELINE_OBSERVATION_EXTRACTION_MODEL:-claude-opus-4-8}
  PIPELINE_REPORT_GENERATION_MODEL: ${PIPELINE_REPORT_GENERATION_MODEL:-claude-opus-4-8}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-reports@homean.com}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Homean}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  APP_ENV: ${APP_ENV:-dev}
  DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:3000}
  AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}
  PUBLIC_SHARE_RATE_LIMIT: ${PUBLIC_SHARE_RATE_LIMIT:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  SENTRY_DSN: ${SENTRY_DSN:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_SOLO_MONTHLY_PRICE_ID: ${STRIPE_SOLO_MONTHLY_PRICE_ID:-}
  STRIPE_API_BASE_URL: ${STRIPE_API_BASE_URL:-https://api.stripe.com/v1}
  ANTHROPIC_INPUT_COST_PER_MILLION: ${ANTHROPIC_INPUT_COST_PER_MILLION:-0}
  ANTHROPIC_OUTPUT_COST_PER_MILLION: ${ANTHROPIC_OUTPUT_COST_PER_MILLION:-0}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homean
      POSTGRES_USER: homean
      POSTGRES_PASSWORD: homean
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homean -d homean"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: homean
      MINIO_ROOT_PASSWORD: homean-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-bucket-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 homean homean-minio-secret; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/homean-media;
      "
    restart: "no"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bucket-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bucket-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
