    # Two distinct disclosures. The scope limit applies to every report because
    # the risk of it being read as an inspection finding exists whether or not
    # anything was recorded. The recording notice applies only when the visit
    # carries a recording attestation.
    # PLACEHOLDER WORDING — see consent.counsel_review_status below.
    scope_disclosure: >-
      This report summarizes observations and notes from a property tour. It is
      not a professional home inspection, appraisal, legal opinion, or property
      condition assessment, and it should not be relied on as one.
    recording_disclosure: >-
      This report was prepared from a recording of the visit.
