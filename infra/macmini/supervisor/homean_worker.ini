[program:homean_worker]
command=/Users/hepang/Git/homean/backend/.venv/bin/celery -A app.pipeline.celery_app:celery_app worker --loglevel=info --concurrency=2
directory=/Users/hepang/Git/homean/backend
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/Users/hepang/git/logs/homean_worker.out.log
stderr_logfile=/Users/hepang/git/logs/homean_worker.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED="1",OBJC_DISABLE_INITIALIZE_FORK_SAFETY="YES",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin",DYLD_FALLBACK_LIBRARY_PATH="/opt/homebrew/lib"
