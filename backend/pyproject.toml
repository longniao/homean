[project]
name = "homean-backend"
version = "0.1.0"
description = "Homean API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "anthropic>=0.75,<1",
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "celery[redis]>=5.5,<6",
    "deepgram-sdk>=7,<8",
    "email-validator>=2.2,<3",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.28.0,<1",
    "jinja2>=3.1,<4",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.7.0,<3.0.0",
    "pyjwt>=2.10,<3",
    "pyyaml>=6,<7",
    "sentry-sdk>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "weasyprint>=69,<70",
    # Report photos are downscaled before being inlined. Available transitively
    # through WeasyPrint, but declared because the renderer imports it directly.
    "pillow>=12,<13",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
