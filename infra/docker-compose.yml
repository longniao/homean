name: kawu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kawu
      POSTGRES_USER: kawu
      POSTGRES_PASSWORD: kawu
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kawu -d kawu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kawu
      MINIO_ROOT_PASSWORD: kawu-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-bucket-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 kawu kawu-minio-secret; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/kawu-media;
      "
    restart: "no"

  worker:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://kawu:kawu@postgres:5432/kawu
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kawu}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kawu-minio-secret}
      S3_BUCKET: kawu-media
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-secret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-deepgram}
      APP_ENV: ${APP_ENV:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bucket-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
